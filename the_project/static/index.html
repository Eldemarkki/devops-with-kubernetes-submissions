<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <style>
        :root {
            --primary-color: #266fcf;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        img {
            max-width: 200px;
            max-height: 200px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        li {
            border-inline-start: 4px solid var(--primary-color);
            padding: 8px;
            background-color: #e9f2ff;
        }

        form {
            display: flex;
            width: 100%;
            gap: 0.5rem;
        }

        input {
            border-color: var(--primary-color);
            padding: 4px;
            min-width: 250px;
            flex: 1;
        }

        button {
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 8px 16px;
        }

        button:hover {
            filter: brightness(90%);
            transition-duration: 100ms;
        }
    </style>
</head>

<body>
    <main>
        <h1>Todo app</h1>
        <img src="/image" />
        <form>
            <input type="text" placeholder="Enter a new task" maxlength="140" required />
            <button type="submit">
                Create
            </button>
        </form>

        <h2>Todos</h2>
        <ul>
            <li>Cook food</li>
            <li>Wash the dishes</li>
            <li>Clean the house</li>
        </ul>

    </main>
</body>

</html>
