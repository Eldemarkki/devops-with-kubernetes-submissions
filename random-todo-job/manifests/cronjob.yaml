apiVersion: batch/v1
kind: CronJob
metadata:
  name: random-todo-job
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: random-todo-job
              image: RANDOM-TODO-JOB-IMAGE
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              envFrom:
                - configMapRef:
                    name: random-todo-job-config
          restartPolicy: OnFailure
