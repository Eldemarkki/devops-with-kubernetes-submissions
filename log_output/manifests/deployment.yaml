apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      containers:
        - name: hashgenerator
          image: log-generator:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: log-file
              mountPath: /app/logs
          env:
            - name: LOG_PATH
              value: /app/logs/log.txt
        - name: log-server
          image: log-server:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: log-file
              mountPath: /app/logs
            - name: config-volume
              mountPath: /app/config
          env:
            - name: LOG_PATH
              value: /app/logs/log.txt
            - name: CONFIG_PATH
              value: /app/config/information.txt
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
      volumes:
        - name: log-file
          emptyDir: {}
        - name: config-volume
          configMap:
            name: log-output-config
