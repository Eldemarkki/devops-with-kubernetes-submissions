apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: ghcr.io/eldemarkki/pingpong-app:3.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pingpong-postgres-config
